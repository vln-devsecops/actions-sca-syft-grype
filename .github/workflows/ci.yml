name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/ -v --cov=scripts --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Validate coverage
        uses: vln-devsecops/actions-validate-coverage@v1
        with:
          coverage-file: coverage.xml
          coverage-type: cobertura
          minimum-coverage: "95"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  baseline:
    if: github.event_name == 'push'
    needs: unit-tests
    uses: ./.github/workflows/sca-baseline.yml
    permissions:
      contents: read
    with:
      baseline-branches: '["dev"]'
      project-key: actions-sca-syft-grype-fixtures
      project-base-dir: fixtures

  pr-scan:
    if: github.event_name == 'pull_request'
    needs: unit-tests
    uses: ./.github/workflows/sca-pr.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      project-key: actions-sca-syft-grype-fixtures
      project-base-dir: fixtures

  # Not wired to push/pull_request: sca-mainline.yml's whole point is
  # detecting drift between two scans of otherwise-unchanged code, which
  # doesn't have a natural trigger on every CI run the way baseline/pr-scan
  # do. workflow_dispatch lets this be exercised deliberately (see
  # docs/test-procedure.md) without firing on every push and either
  # spamming a tracking issue or racing the baseline job over the same
  # commit.
  mainline:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    uses: ./.github/workflows/sca-mainline.yml
    permissions:
      contents: read
      checks: write
      issues: write
      actions: read
    with:
      project-key: actions-sca-syft-grype-fixtures
      project-base-dir: fixtures
