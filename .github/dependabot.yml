version: 2
updates:
  # docker-compose.tools.yml declares the pinned syft and grype images, so a
  # single directory scan covers both. See docker-compose.tools.yml for why
  # they're declared there instead of hardcoded tags in a script.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
